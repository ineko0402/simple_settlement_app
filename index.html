<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#4caf50">
  <title>会計仕訳ツール</title>

  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="ledger.css">

  <link rel="icon" href="icon/favicon.ico" sizes="any">
  <link rel="icon" href="icon/favicon-32x32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="icon/favicon-16x16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="icon/icon-152x152.png">
</head>

<body data-theme="dark">
  <header class="header">
    <div class="header-heading">
      <h1 class="header-title">会計仕訳ツール</h1>
      <span class="header-balance" id="headerBalance" hidden>
        <span id="ledgerBalanceLabel">残高</span>
        <strong id="ledgerBalance">0 円</strong>
      </span>
    </div>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="テーマを切り替え">
      <span class="material-symbols-outlined">dark_mode</span>
    </button>
  </header>

  <main class="main-content">
    <section id="settlement" class="section active">
      <div class="card">
        <div class="input-row">
          <label class="input-label" for="karibarai">仮払金</label>
          <div class="input-wrapper">
            <input id="karibarai" class="input" type="text" inputmode="numeric" placeholder="10,000">
          </div>
        </div>

        <div class="input-row">
          <label class="input-label" for="seisan">清算</label>
          <div class="input-wrapper">
            <input id="seisan" class="input" type="text" inputmode="numeric" placeholder="8,500">
          </div>
        </div>

        <div class="input-row">
          <label class="input-label" for="otsuri">おつり</label>
          <div class="input-wrapper">
            <input id="otsuri" class="input" type="text" inputmode="numeric" placeholder="0">
          </div>
        </div>
      </div>

      <div id="settlementResult" class="result-card" style="display: none;">
        <div class="result-label">計算結果</div>
        <div class="result-value">受け取り 1,500 円</div>
      </div>

      <button class="btn btn-primary" id="calculateSettlement" type="button">
        <span class="material-symbols-outlined">calculate</span>
        計算する
      </button>
    </section>

    <section id="nyukin" class="section">
      <div class="card">
        <h2 class="card-title">入金仕訳</h2>

        <div class="input-row">
          <label class="input-label" for="nyukinAmount">入金額</label>
          <div class="input-wrapper">
            <input id="nyukinAmount" class="input" type="text" inputmode="numeric" placeholder="5,000">
          </div>
        </div>

        <div class="input-row">
          <label class="input-label" for="tesuryo">手数料</label>
          <div class="input-wrapper">
            <input id="tesuryo" class="input" type="text" inputmode="numeric" placeholder="440">
          </div>
        </div>

        <div class="input-row">
          <label class="input-label" for="taxRounding">端数処理</label>
          <div class="input-wrapper">
            <select id="taxRounding" class="input">
              <option value="floor">切り捨て</option>
              <option value="round">四捨五入</option>
            </select>
          </div>
        </div>
      </div>

      <button class="btn btn-primary" id="calculateNyukin" type="button">
        <span class="material-symbols-outlined">calculate</span>
        計算する
      </button>

      <div id="nyukinResult" style="display: none; margin-top: 16px;">
        <div class="card">
          <h3 class="card-title">借方</h3>
          <table class="data-table">
            <tr class="data-row"><td class="data-cell">預金</td><td class="data-cell" id="debitYokin">0</td></tr>
            <tr class="data-row"><td class="data-cell">手数料</td><td class="data-cell" id="debitTesuryo">0</td></tr>
            <tr class="data-row"><td class="data-cell">仮払消費税</td><td class="data-cell" id="debitKariharaiTax">0</td></tr>
          </table>
        </div>

        <div class="card">
          <h3 class="card-title">貸方</h3>
          <table class="data-table">
            <tr class="data-row"><td class="data-cell">収入</td><td class="data-cell" id="creditSyunyu">0</td></tr>
            <tr class="data-row"><td class="data-cell">仮受消費税</td><td class="data-cell" id="creditKariukeTax">0</td></tr>
          </table>
        </div>
      </div>
    </section>

    <section id="import" class="section">
      <div class="card">
        <h2 class="card-title">輸入消費税仕訳</h2>
        <div class="input-row">
          <label class="input-label" for="paidTax">支払消費税</label>
          <div class="input-wrapper">
            <input id="paidTax" class="input" type="text" inputmode="numeric" placeholder="10,000">
          </div>
        </div>
      </div>

      <button class="btn btn-primary" id="calculateImport" type="button">
        <span class="material-symbols-outlined">calculate</span>
        計算する
      </button>

      <div id="importResult" style="display: none; margin-top: 16px;">
        <div class="card">
          <table class="data-table">
            <tr class="data-row"><td class="data-cell">支払消費税</td><td class="data-cell" id="outputPaidTax">0</td></tr>
            <tr class="data-row"><td class="data-cell">輸入消費税</td><td class="data-cell" id="outputImportTax">0</td></tr>
            <tr class="data-row"><td class="data-cell">地方消費税</td><td class="data-cell" id="outputLocalTax">0</td></tr>
          </table>
        </div>
      </div>
    </section>

    <section id="ledger" class="section ledger-section">
      <div class="ledger-view-tabs" role="tablist" aria-label="帳簿表示">
        <button class="ledger-view-tab active" type="button" data-ledger-view="input">入力</button>
        <button class="ledger-view-tab" type="button" data-ledger-view="daily">日次</button>
        <button class="ledger-view-tab" type="button" data-ledger-view="weekly">週次</button>
        <button class="ledger-view-tab" type="button" data-ledger-view="monthly">月次</button>
      </div>

      <div id="ledgerInputView">
        <div class="ledger-table-wrap">
          <div class="ledger-header" aria-hidden="true">
            <span>日付</span><span>内容</span><span>金額</span><span></span>
          </div>
          <div id="ledgerBody"></div>
          <p class="ledger-empty" id="ledgerEmpty">「行を追加」から入力を始めます。</p>
        </div>

        <button class="btn btn-primary ledger-add" id="addLedgerEntry" type="button">
          <span class="material-symbols-outlined">add</span>
          行を追加
        </button>
      </div>

      <div id="ledgerSummaryView" hidden>
        <div class="ledger-period">
          <button class="ledger-period-button" id="ledgerPrevMonth" type="button" aria-label="前月">‹</button>
          <strong id="ledgerPeriodLabel"></strong>
          <button class="ledger-period-button" id="ledgerNextMonth" type="button" aria-label="翌月">›</button>
        </div>

        <div class="ledger-carry-warning" id="ledgerCarryWarning" hidden></div>
        <div class="ledger-summary-list" id="ledgerSummaryList"></div>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="メインメニュー">
    <button class="nav-item active" data-section="settlement" type="button">
      <span class="material-symbols-outlined nav-icon">receipt</span><span class="nav-label">清算</span>
    </button>
    <button class="nav-item" data-section="nyukin" type="button">
      <span class="material-symbols-outlined nav-icon">savings</span><span class="nav-label">入金</span>
    </button>
    <button class="nav-item" data-section="import" type="button">
      <span class="material-symbols-outlined nav-icon">local_shipping</span><span class="nav-label">輸入</span>
    </button>
    <button class="nav-item" data-section="ledger" type="button">
      <span class="material-symbols-outlined nav-icon">menu_book</span><span class="nav-label">帳簿</span>
    </button>
  </nav>

  <button class="fab visible" id="resetFab" type="button" aria-label="入力をリセット">
    <span class="material-symbols-outlined">refresh</span>
  </button>

  <div class="snackbar" id="snackbar" role="status" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
</body>

</html>
